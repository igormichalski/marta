[cosmic-ray]
module-path = "crivo.py"
timeout = 10.0
test-command = "python -m pytest test_crivo.py"

[cosmic-ray.distributor]
name = "local"

[framework]
test-file = "test_crivo.py"
provider = "groq"
model = "llama-3.3-70b-versatile"
temperature = 0.1
max-attempts = 5
api-key-env = "GROQ_API_KEY"
rag = true
rag-k = 3
