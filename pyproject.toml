[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marta"
version = "0.1.0"
description = "MARTA: framework multiagente de fortalecimento de suítes de teste guiado por mutação, RAG e um laço de geração e crítica com LLM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Igor Roberto Michalski de Souza" },
]
keywords = ["mutation testing", "unit tests", "llm", "rag", "test generation"]
dependencies = [
    "cosmic-ray>=8.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "groq>=1.0",
    "toml>=0.10",
    "python-dotenv>=1.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
experimentos = ["matplotlib>=3.8"]

[project.scripts]
marta = "marta.framework:main"

[tool.setuptools]
packages = ["marta"]
